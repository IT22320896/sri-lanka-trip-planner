research_task:
  description: >
    You are researching this trip request: {user_request}.

    The trip details are:
    - Origin: {origin}
    - Destination: {destination}
    - Group size: {group_size}
    - Duration: {duration_days} days
    - Travel dates: {travel_dates}
    - Budget focus: {budget_focus}
    - Current date: {current_date}

    IMPORTANT: You MUST call the get_weather_and_attractions tool exactly
    once with destination="{destination}" and date="{weather_date}".
    Use that exact date string for the forecast day (first trip day).
    Do NOT skip the tool call. Use Action / Action Input.

    After the tool returns, your Final Answer MUST be ONLY the raw JSON the
    tool returned — the same keys as in Tool Output. Do NOT invent another
    JSON schema. Do NOT output function-call JSON like {{"name": ...}}.
  expected_output: >
    The exact JSON object returned by the tool with keys: destination,
    date, coordinates, weather, attractions, sources, errors, cached.
  agent: research_agent

budget_task:
  description: >
    You have research data from the previous task. Now you MUST call the
    calculate_trip_budget tool with these exact parameters:
    - people: {group_size}
    - destination: "{destination}"
    - days: {duration_days}

    Do NOT skip the tool call. Do NOT make up budget numbers. Use the
    Action and Action Input format to call the tool. After receiving the
    result, return ONLY the raw tool output as your Final Answer. Do NOT
    wrap it in any other JSON structure.
  expected_output: >
    The exact JSON object returned by the tool with keys: destination,
    people, days, daily_per_person_lkr, budget_breakdown, total_lkr,
    total_usd, exchange_rate_lkr_per_usd, budget_file, and assumptions.
  agent: budget_agent

itinerary_task:
  description: >
    You have research and budget data from previous tasks. Now you MUST
    call the create_itinerary_file tool exactly once with argument plan_data.

    Extract JSON from previous outputs: research gives weather + attractions;
    budget gives total_lkr, budget_file, budget_breakdown.

    Build plan_data with keys:
    - origin: "{origin}"
    - destination: "{destination}"
    - days: {duration_days}
    - group_size: {group_size}
    - travel_dates: {travel_dates}
    - budget: full budget dict from the budget task (include total_lkr, budget_file).
    - weather: weather dict from research (temp_max_c, temp_min_c, precip_prob_percent).
    - attractions: list from research (objects with "title").

    Use Action: create_itinerary_file and Action Input with plan_data only.
    Your Final Answer MUST be ONLY the file path string printed by the tool,
    on one line — no markdown, no explanation, no fake paths.
  expected_output: >
    Just the file path string returned by the tool, nothing else.
  agent: itinerary_agent

review_task:
  description: >
    You MUST call the validate_plan tool with itinerary_path="auto" so it
    resolves the latest itinerary from outputs.

    Action: validate_plan
    Action Input: {{"itinerary_path": "auto"}}

    Then write a markdown report with sections:

    ## Summary
    One paragraph: {origin} to {destination}, {group_size} people,
    {duration_days} days, dates {travel_dates}.

    ## Itinerary
    Briefly describe destination and duration.

    ## Budget Highlights
    Copy totals and breakdown ONLY from the budget task output in context:
    total_lkr, total_usd, and lodging / food / transport / activities /
    contingency — use the real numbers from context, never placeholder values.

    ## Validation Results
    Summarize issues, warnings, and metrics from the validate_plan tool output.

    ## Next Steps
    Practical bullets; if research weather included precip_prob_percent, mention
    packing or timing using that number when relevant.

    Return ONLY the markdown report as plain text. Do NOT wrap it in code fences.
  expected_output: >
    A clean markdown report as plain text with Summary, Itinerary, Budget
    Highlights, Validation Results, and Next Steps sections.
  agent: reviewer_agent
